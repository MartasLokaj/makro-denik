<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Makro deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one phone-width column; Today opens on a big picnic-blanket calorie ring, sticky headers, fixed bottom tab bar,
   full-screen sheets, a timer strip while kitchen timers run, and a full-screen cooking mode.
   Vibe: red and white; a strip of gingham picnic blanket tops the calorie card. Always light: red and white even when the phone is in dark mode. */
:root,:root[data-theme="dark"]{
  color-scheme: light;
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#2E1418;
  --ink-2:#74484E;
  --muted:#B08A8F;
  --primary:#D7263D;
  --primary-deep:#B01C31;
  --on-primary:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#FCE7EA;
  --soft:#FBF6F6;
  --line:#EFE4E5;
  --line-2:#E3D5D7;
  --hl:#FFD6DC;
  --track:#F6E3E5;
  --carb:#E9A31F;
  --fat:#5E9E6E;
  --carb-a:#FFFCF0; --carb-b:#FFF3CF; --carb-border:#F3D98F; --carb-ink:#8A5A00; --carb-band:rgba(233,163,31,.5);
  --fat-a:#F6FBF7; --fat-b:#E4F2E8; --fat-border:#BCDDC5; --fat-ink:#2F6B40; --fat-band:rgba(94,158,110,.5);
  --over:#7E1626;
  --good:#2F8F55;
  --good-bg:#E7F5EC;
  --protein-a:#FFF5F5; --protein-b:#FDE6E9; --protein-border:#F4C2C8;
  --chip-bg:#FDE3E7; --chip-fg:#A11528; --chip-border:#F2B3BC;
  --danger-bg:#FBE7E4; --danger-fg:#9E2A18;
  --banner-bg:#FFF6E5; --banner-fg:#7A5200;
  --toast-bg:#2E1418; --toast-fg:#FFFFFF;
  --bar:rgba(255,255,255,.96);
  --done-bg:#E7F5EC;
  --g-base:#FFFFFF; --g-red:#D7263D; --g-red-a:rgba(215,38,61,.5);
  --plate-shadow:rgba(126,22,38,.18);
  --shadow:0 4px 14px rgba(126,22,38,.08);
  --font:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Bricolage Grotesque", "Figtree", system-ui, -apple-system, sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --tbh:0px;
}
html.has-timers{--tbh:calc(60px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input{min-width:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.topbar h1{margin:0;font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink);flex:1;text-wrap:balance;line-height:1.1}
.daysw{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.daysw .lbl{flex:1;text-align:center;min-width:0}
.daysw .lbl b{display:inline-block;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--ink);background:linear-gradient(transparent 60%,var(--hl) 60%);padding-inline:4px}
.daysw .lbl span{display:block;font-size:13px;color:var(--ink-2);font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--primary-deep);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:22px;height:22px}
.pill{font-family:var(--font);letter-spacing:.02em;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card-2);color:var(--primary-deep);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);font-weight:800}
/* Calorie ring */
/* Calorie card: white rectangle whose top edge is a strip of picnic blanket */
.ringcard{display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:min(46vw,176px);aspect-ratio:1;flex:none;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-family:var(--display);font-size:clamp(30px,9vw,40px);font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.ring .center span{font-size:12px;color:var(--ink-2);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.ring.over .center b{color:var(--over)}
.ringstats{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.ringstats .stat+.stat{border-top:2px dashed var(--line);padding-top:12px}
.stat small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:800}
.stat b{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat b i{font-style:normal;font-size:14px;color:var(--ink-2);font-weight:700;margin-left:2px}
/* Macro bars */
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c,var(--primary));width:0;transition:width .5s ease}
.bar.over>i{background:var(--over)}
.protein{background:linear-gradient(160deg,var(--protein-a),var(--protein-b));border:2px solid var(--protein-border)}
.protein .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.protein .head h3{margin:0;font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.protein .val{font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.02em}
.protein .val i{font-style:normal;font-size:15px;color:var(--ink-2);font-weight:700}
.protein .bar{height:18px;margin-top:10px;background:var(--surface)}
.protein .sub{margin-top:8px;font-size:14px;color:var(--ink-2);font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.mrow{padding:14px 18px}
.mrow .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mrow h3{margin:0;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mrow .val{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.02em}
.mrow .val i{font-style:normal;font-family:var(--font);font-size:14px;color:var(--ink-2);font-weight:700;letter-spacing:0}
.mrow .bar{height:12px;margin-top:8px;background:var(--surface)}
.mrow .sub{margin-top:6px;font-size:13px;font-weight:700}
.mrow.carb{--c:var(--carb);background:linear-gradient(160deg,var(--carb-a),var(--carb-b));border-color:var(--carb-border)}
.mrow.carb .sub,.mrow.carb h3{color:var(--carb-ink)}
.mrow.fat{--c:var(--fat);background:linear-gradient(160deg,var(--fat-a),var(--fat-b));border-color:var(--fat-border)}
.mrow.fat .sub,.mrow.fat h3{color:var(--fat-ink)}
.mrow .bar>i{background:var(--c)}
.mrow .bar.over>i{background:var(--over)}
/* Entries */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;text-align:left;padding:0}
.row .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--ink-2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nums{text-align:right;flex:none}
.row .nums b{display:block;font-size:16px;font-weight:900}
.row .nums span{font-size:13px;color:var(--primary-deep);font-weight:800}
.row .acts{display:flex;gap:4px;flex:none}
.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1.5px solid var(--line)}
.sq svg{width:18px;height:18px}
.sq.danger{color:var(--over)}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--primary-deep);background:var(--card-2);border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.empty{padding:18px 4px;text-align:center;color:var(--ink-2);font-weight:700}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:999px;font-weight:800;font-size:17px;border:2px solid transparent;width:100%;transition:transform .08s ease, background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-big{min-height:64px;font-size:19px;letter-spacing:.04em}
.btn-soft{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn-ghost{background:transparent;color:var(--primary-deep);min-height:48px}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}
/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.field .hint{font-size:13px;color:var(--muted);font-weight:700;text-transform:none;letter-spacing:0}
.inp{width:100%;height:56px;border-radius:18px;border:2px solid var(--line-2);background:var(--surface);padding:0 18px;font-size:18px;font-weight:700}
.inp::placeholder{color:var(--muted);font-weight:500}
.inp:focus{border-color:var(--primary);outline:none}
.inp.err{border-color:var(--over)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;color:var(--ink-2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary-deep);box-shadow:0 2px 6px rgba(126,22,38,.12)}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search .inp{padding-left:46px;font-weight:700}
.errmsg{color:var(--danger-fg);font-size:14px;font-weight:800}
/* Food items */
.fitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);text-align:left;width:100%}
.fitem .main{flex:1;min-width:0}
.fitem .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .meta{font-size:13px;color:var(--ink-2);font-weight:700}
.fitem .plus{width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.fitem .plus svg{width:20px;height:20px}
.fitem .freq{font-size:11px;font-weight:800;color:var(--primary-deep);background:var(--card-2);border-radius:999px;padding:2px 8px;flex:none}
.flist{display:flex;flex-direction:column;gap:8px}
.section-l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px 0}
/* Amount panel */
.qtywrap{display:flex;align-items:center;gap:10px}
.qtywrap .inp{height:68px;font-size:32px;font-weight:900;text-align:center;flex:1}
.step{width:56px;height:56px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line-2);color:var(--primary-deep);font-size:28px;font-weight:900;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line-2);font-weight:700;color:var(--ink);font-size:16px}
.chip[aria-pressed="true"]{background:var(--card-2);border-color:var(--primary);color:var(--primary-deep)}
.chip .ce{font-size:20px;line-height:1}
.result{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.result div{background:var(--soft);border-radius:14px;padding:10px 4px}
.result b{display:block;font-size:20px;font-weight:900}
.result small{font-size:12px;font-weight:800;color:var(--ink-2)}
.result .kc b{color:var(--ink)}
.result .pr{outline:2px solid var(--protein-border)}
.result .pr b{color:var(--primary-deep)}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;max-width:520px;width:100%;margin:0 auto}
.sheet-head h2{margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.025em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:4px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;color:var(--muted);font-size:11.5px;font-weight:800;min-width:0}
.tab svg{width:25px;height:25px}
.tab .ic{width:48px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
/* Cookbook */
textarea.inp{height:auto;min-height:130px;padding:12px 16px;font-size:16px;font-weight:600;line-height:1.5;resize:vertical}
.rcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;text-align:left;width:100%}
.rcard .top{display:flex;align-items:center;gap:8px}
.rcard .name{flex:1;min-width:0;font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .meta{font-size:13px;color:var(--ink-2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .macros{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:13px;font-weight:800;background:var(--soft);border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.mchip.k{color:var(--ink)} .mchip.p{color:var(--primary-deep);outline:2px solid var(--protein-border)}
.linked{font-size:11px;font-weight:800;color:var(--good);background:var(--good-bg);border-radius:999px;padding:3px 9px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:flex;gap:12px;line-height:1.5;counter-increment:st}
.steps li::before{content:counter(st);flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--primary-deep);font-weight:900;display:grid;place-items:center;font-size:14px}
.rsum{font-size:14px;color:var(--ink-2);font-weight:700;text-align:center;margin-top:8px}
/* Emoji icons & photos */
.emo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo.sm{width:40px;height:40px;font-size:22px;border-radius:12px}
.emo.xl{width:64px;height:64px;font-size:36px;border-radius:20px}
.row .emo{width:40px;height:40px;font-size:22px;border-radius:12px}
.card .emo{background:var(--soft)}
.amthead{display:flex;align-items:center;gap:12px}
.amthead .note{flex:1;min-width:0;text-align:left}
.thumb{position:relative;width:68px;height:68px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:36px;line-height:1;flex:none;overflow:hidden}
.thumb img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero{position:relative;width:100%;aspect-ratio:4/3;max-height:320px;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:96px;line-height:1}
.hero.small{aspect-ratio:auto;height:150px;font-size:72px}
.rcard .top{display:flex;align-items:center;gap:14px}
.rcard .rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.emorow{display:flex;align-items:center;gap:12px}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;background:var(--soft);border-radius:18px;padding:10px;max-height:260px;overflow-y:auto}
.emogrid button{height:44px;border-radius:12px;font-size:24px;background:var(--surface);line-height:1}
.emogrid button[aria-pressed="true"]{outline:3px solid var(--primary)}
.photobtns{display:flex;gap:10px;flex-wrap:wrap}
.photobtns>*{flex:1;min-width:140px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tab[aria-current="page"]{color:var(--primary-deep)}
.tab[aria-current="page"] .ic{background:var(--card-2)}
/* Weight */
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wstat{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;min-width:0}
.wstat small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.wstat b{font-size:20px;font-weight:900;white-space:nowrap}
.wstat b.down{color:var(--good)} .wstat b.up{color:var(--over)}
.wstat span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.chart{width:100%;height:210px;display:block}
.chart text{font-family:var(--font);font-size:11px;font-weight:700;fill:var(--ink-2)}
/* Toast & banner */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--toast-bg);color:var(--toast-fg);border-radius:999px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(46,20,24,.25);max-width:calc(100% - 32px)}
.toast button{background:var(--primary);color:var(--on-primary);border-radius:999px;padding:6px 14px;font-weight:900}
.toast.solo{padding-right:18px}
.banner{background:var(--banner-bg);color:var(--banner-fg);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:700}
.note{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
/* Timer strip, offsets */
body{padding-top:var(--tbh)}
.topbar{top:calc(env(safe-area-inset-top,0px) + var(--tbh))}
.sheet{top:var(--tbh)!important}
#timerbar{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--tbh);background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px}
#timerbar .in{max-width:520px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding-inline:12px;scrollbar-width:none}
#timerbar .in::-webkit-scrollbar{display:none}
.tpill{display:flex;align-items:center;gap:6px;flex:none;background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:0 4px 0 14px;height:44px;white-space:nowrap;max-width:86vw}
.tpill .lbl{font-size:13px;font-weight:800;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.tpill b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.tpill button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--primary-deep);background:var(--surface)}
.tpill button svg{width:16px;height:16px}
.tpill.done{background:var(--good-bg);animation:pulse 1s ease-in-out infinite}
.tpill.done b{color:var(--good)}
.tpill.paused b{color:var(--muted)}
@keyframes pulse{50%{transform:scale(1.04)}}
/* Interactive recipe */
.rdesc{margin:0;color:var(--ink-2);font-weight:700;line-height:1.5}
.servctl{display:flex;align-items:center;gap:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:6px}
.servctl .step{width:48px;height:48px;font-size:26px;background:var(--surface)}
.servctl .mid{flex:1;text-align:center;line-height:1.15}
.servctl .mid b{display:block;font-size:22px;font-weight:900}
.servctl .mid span{font-size:12px;color:var(--ink-2);font-weight:800}
.servctl .mid:disabled{opacity:1;cursor:default}
.step:disabled,.sq:disabled{opacity:.35;cursor:default}
.ing{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 0;border-top:1px solid var(--line);text-align:left}
.ing:first-child{border-top:0}
.ing .chk{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--primary);flex:none;display:grid;place-items:center;color:var(--on-primary)}
.ing .chk svg{width:16px;height:16px;opacity:0}
.ing .txt{flex:1;min-width:0;font-weight:700;line-height:1.35}
.ing .txt b{font-weight:900;color:var(--primary-deep);font-variant-numeric:tabular-nums}
.ing.on .chk{background:var(--primary)}
.ing.on .chk svg{opacity:1}
.ing.on .txt{text-decoration:line-through;color:var(--muted)}
.ing.on .txt b{color:var(--muted)}
.ing .emo{width:36px;height:36px;font-size:20px;border-radius:11px}
.ingrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.ingrow:first-child{border-top:0}
.ingrow .ing{flex:1;min-width:0;border-top:0}
.ingadj{flex:none;font-size:18px;font-weight:800}
.dtag{display:inline-block;font-size:12px;font-weight:800;color:var(--good);background:var(--good-bg);border-radius:999px;padding:1px 8px;vertical-align:1px;text-decoration:none}
.tweaks{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);background:var(--good-bg);border-radius:14px;padding:10px 12px;margin-top:6px}
.tweaks span{flex:1;min-width:200px}
.stepc{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.stepc .sh{display:flex;align-items:center;gap:10px}
.stepc .no{width:32px;height:32px;border-radius:50%;background:var(--card-2);color:var(--primary-deep);display:grid;place-items:center;font-weight:900;flex:none}
.stepc h4{margin:0;font-size:18px;font-weight:900;flex:1;min-width:0}
.stepc p{margin:0;line-height:2;font-weight:600}
.ichip{position:relative;display:inline;background:var(--chip-bg);color:var(--chip-fg);border:1.5px solid var(--chip-border);border-radius:10px;padding:3px 8px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-size:inherit;line-height:inherit}
.ichip::after{content:"";position:absolute;inset:-7px -3px}
.tbtn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--primary-deep);font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;border:2px solid var(--protein-border)}
.tbtn svg{width:16px;height:16px}
.tbtn.run{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tbtn.paused{border-style:dashed}
.tbtn.done{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.notes{background:var(--soft);border-radius:var(--r-md);padding:14px 16px;color:var(--ink-2);font-weight:700;line-height:1.5;border:1px solid var(--line)}
.notes small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted);margin-bottom:4px}
.rtools{display:flex;gap:10px;flex-wrap:wrap}
.rtools>*{flex:1;min-width:150px}
.rtools .btn{white-space:nowrap;padding-inline:14px;font-size:16px}
/* Recipe editor */
.stepedit{background:var(--soft);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.stepedit .sh{display:flex;align-items:center;gap:8px}
.stepedit .sh b{flex:1;font-weight:900}
.insrow{display:flex;flex-wrap:wrap;gap:6px}
.insrow button{min-height:40px;padding:0 12px;border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);font-weight:800;font-size:14px}
.inp.sm{height:46px;font-size:16px}
/* Cooking mode */
.cook{position:fixed;left:0;right:0;bottom:0;top:var(--tbh);z-index:45;background:var(--bg);display:flex;flex-direction:column}
.cook-head{max-width:620px;width:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;align-items:center;gap:10px}
html.has-timers .cook-head{padding-top:10px}
.cook-head .t{flex:1;min-width:0}
.cook-head .t b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-head .t span{font-size:13px;color:var(--ink-2);font-weight:800}
.cook-prog{max-width:620px;width:calc(100% - 32px);margin:0 auto;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.cook-prog i{display:block;height:100%;background:var(--primary);transition:width .3s}
.cook-body{flex:1;overflow-y:auto}
.cook-inner{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 24px;display:flex;flex-direction:column;gap:18px}
.cook-inner h2{margin:0;font-family:var(--display);font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.cook-inner .ct{font-size:clamp(21px,5.8vw,26px);line-height:1.75;font-weight:700;margin:0}
.cook-inner .tbtn{min-height:60px;font-size:22px;padding:0 26px}
.cook-inner .ing{min-height:60px;font-size:19px}
.cook-foot{max-width:620px;width:100%;margin:0 auto;display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cook-foot .btn{min-height:64px;font-size:19px}
.cook-foot .back{flex:0 0 34%}
.wl{font-size:12px;color:var(--muted);font-weight:800;text-align:center}
/* Amount popover */
.pop{position:fixed;inset:0;z-index:70;background:rgba(40,10,14,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.pop-card{background:var(--bg);border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
.pop-card h3{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.unitrow{display:flex;align-items:center;gap:10px}
.unitrow .inp{flex:1;height:64px;font-size:30px;font-weight:900;text-align:center}
.unitrow span{font-size:20px;font-weight:900;color:var(--ink-2);min-width:2.5em}
/* Picnic blanket strip on top of a card (default red; carb/fat variants) */
.blanket{position:relative;overflow:hidden;padding-top:42px}
.blanket::before{content:"";position:absolute;left:0;right:0;top:0;height:24px;background-color:var(--g-base);
  background-image:linear-gradient(90deg,var(--gb,var(--g-red-a)) 50%,transparent 50%),linear-gradient(var(--gb,var(--g-red-a)) 50%,transparent 50%);
  background-size:14px 14px;border-bottom:1.5px solid var(--gb,var(--g-red-a))}
.blanket.carb{--gb:var(--carb-band)} .blanket.fat{--gb:var(--fat-band)}
.hl{background:linear-gradient(transparent 60%,var(--hl) 60%);padding-inline:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* Fridge */
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary-deep);margin:4px 2px -6px}
.bigq{margin:0;font-family:var(--display);font-size:clamp(32px,9.5vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.bigq mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding-inline:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fridge{display:flex;flex-direction:column;gap:12px}
.flabel{font-size:17px;font-weight:800}
.fhint{margin:0;font-size:14px;color:var(--ink-2);font-weight:500}
.fsec{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.chip .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-right:-6px;background:var(--surface);color:var(--primary-deep);font-size:15px;line-height:1}
.match{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--ink-2);max-width:100%;white-space:normal}
.match.all{background:var(--good-bg);color:var(--good)}
.match.some{background:var(--card-2);color:var(--primary-deep)}
/* Calorie card: ring + the coach who opens the AI chat */
.ringcard{flex-direction:column;align-items:stretch;gap:14px}
.ringrow{display:flex;align-items:center;gap:6px}
.ring{width:min(43vw,170px)}
.coach{position:relative;flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;border-radius:20px;z-index:1}
.coach .bubble{position:relative;z-index:2;background:var(--surface);border:1.5px solid var(--line-2);border-radius:14px;padding:5px 10px;font-size:13px;font-weight:800;white-space:nowrap;margin-bottom:6px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.coach .bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;background:var(--surface);border-right:1.5px solid var(--line-2);border-bottom:1.5px solid var(--line-2);transform:translateX(-50%) rotate(45deg)}
/* The coach is one picture in five layers: the whole figure, then each arm and each pec cut out on top so they can move. */
.arny{position:relative;display:block;width:100%;max-width:156px;aspect-ratio:214/331;transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.arny i{position:absolute;inset:0;background:var(--arny) center/100% 100% no-repeat}
.arny .al{clip-path:polygon(0 23%,21.5% 23%,24.3% 30.2%,27.1% 42.3%,23.4% 48.9%,0 48.9%);transform-origin:27% 42%}
.arny .ar{clip-path:polygon(70.1% 23%,100% 23%,100% 50.2%,69.2% 50.2%,65.4% 42.3%,68.2% 30.2%);transform-origin:65% 42%}
.arny .pl{clip-path:polygon(23.4% 39.3%,45.3% 38.7%,45.3% 50.8%,32.7% 51.7%,23.4% 48.9%);transform-origin:34% 50%}
.arny .pr{clip-path:polygon(45.3% 38.7%,66.4% 39.3%,66.8% 48.3%,58.4% 50.8%,45.3% 50.8%);transform-origin:56% 50%}
.coach:hover .arny,.coach:focus-visible .arny,.coach.flex .arny{transform:scale(1.13)}
.coach:hover .bubble,.coach:focus-visible .bubble,.coach.flex .bubble{transform:translateY(-14px) scale(1.05)}
.coach:hover .al,.coach:focus-visible .al,.coach.flex .al{animation:armL 2.4s ease-in-out infinite}
.coach:hover .ar,.coach:focus-visible .ar,.coach.flex .ar{animation:armR 2.4s ease-in-out infinite}
.coach:hover .pl,.coach:focus-visible .pl,.coach.flex .pl{animation:pecL 2.4s ease-in-out infinite}
.coach:hover .pr,.coach:focus-visible .pr,.coach.flex .pr{animation:pecR 2.4s ease-in-out infinite}
@keyframes armL{0%,40%,100%{transform:none}10%,30%{transform:rotate(-5deg) scale(1.08)}20%{transform:rotate(-1deg) scale(1.02)}}
@keyframes armR{0%,40%,100%{transform:none}10%,30%{transform:rotate(5deg) scale(1.08)}20%{transform:rotate(1deg) scale(1.02)}}
@keyframes pecL{0%,45%,55%,65%,75%,85%,95%,100%{transform:none}50%,70%,90%{transform:translateY(-2.3%) scale(1.05)}}
@keyframes pecR{0%,55%,65%,75%,85%,100%{transform:none}60%,80%,96%{transform:translateY(-2.3%) scale(1.05)}}
.ringstats{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--soft);border-radius:var(--r-md);padding:10px 14px}
.ringstats .stat+.stat{border-top:0;padding-top:0;border-left:2px dashed var(--line-2);padding-left:14px}
/* Macro tiles (tap to edit) */
.macros2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macros2 .mrow{padding:14px}
.macros2 .mrow .head{align-items:center;flex-wrap:nowrap}
.macros2 .mrow h3{font-size:17px;min-width:0}
.macros2 .mrow .val{font-size:22px;margin-top:4px}
.edit-badge{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--ink-2);flex:none}
.mtap{cursor:pointer;transition:transform .12s ease}
.mtap:active{transform:scale(.985)}
.protein .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.edit-hint{font-size:12px;color:var(--muted);font-weight:700}
/* Macro editor */
.medit{gap:16px}
.mehead{display:flex;align-items:center;gap:10px}
.mehead h3{flex:1}
.mehead .dot{width:14px;height:14px}
.me-prot,.me-kcal{--c:var(--primary)} .me-carb{--c:var(--carb)} .me-fat{--c:var(--fat)}
.mebig{display:flex;align-items:baseline;justify-content:center;gap:8px}
.mebig b{font-family:var(--display);font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1}
.mebig span{font-size:20px;font-weight:700;color:var(--ink-2)}
.metrack{position:relative;padding-top:24px}
.goaltick{position:absolute;top:0;bottom:8px;left:calc(var(--gp) * 1% + 17px - var(--gp) * .34px);border-left:2px dashed var(--ink-2);pointer-events:none}
.goaltick i{position:absolute;top:-2px;left:0;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap;background:var(--bg);padding:0 4px}
.mrange{-webkit-appearance:none;appearance:none;display:block;width:100%;height:48px;margin:0;background:transparent;--pct:0%;cursor:pointer;touch-action:pan-y}
.mrange:focus{outline:none}
.mrange::-webkit-slider-runnable-track{height:28px;border-radius:999px;background:linear-gradient(90deg,var(--c) var(--pct),var(--track) var(--pct))}
.mrange::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-3px;border-radius:50%;background:var(--surface);border:4px solid var(--c);box-shadow:0 3px 10px rgba(46,20,24,.25)}
.mrange:focus-visible::-webkit-slider-thumb{outline:3px solid var(--ink);outline-offset:2px}
.mrange::-moz-range-track{height:28px;border-radius:999px;background:var(--track)}
.mrange::-moz-range-progress{height:28px;border-radius:999px;background:var(--c)}
.mrange::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid var(--c)}
.mesteps{justify-content:center}
.meinfo{text-align:center;color:var(--ink-2);font-size:15px}
/* AI chat */
.agent{position:fixed;left:0;right:0;bottom:0;top:var(--tbh);z-index:46;background:var(--bg);display:flex;flex-direction:column}
.ag-head{max-width:620px;width:100%;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line)}
html.has-timers .ag-head{padding-top:10px}
.ag-head .t{flex:1;min-width:0}
.ag-head .t b{display:block;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ag-head .t span{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.ag-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ag-inner{max-width:620px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 15px;border-radius:20px;line-height:1.45;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--soft);border:1.5px solid var(--line);border-bottom-left-radius:6px}
.msg.err{background:var(--danger-bg);color:var(--danger-fg);border-color:transparent;display:flex;flex-direction:column;align-items:flex-start}
.errd{display:block;margin-top:6px;font-size:12px;font-weight:600;opacity:.8;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere;white-space:normal}
.msg.typing{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:700}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg .chip{font-size:15px}
.est{display:flex;flex-direction:column;gap:10px;align-self:stretch}
.er{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.er .emo{width:40px;height:40px;font-size:22px;border-radius:12px}
.er .en{flex:1;min-width:0;display:flex;flex-direction:column}
.er .en b{font-weight:800}
.er .en span,.er .ev span{font-size:13px;color:var(--ink-2);font-weight:600}
.er .ev{text-align:right;display:flex;flex-direction:column;flex:none}
.er .ev b{font-weight:800}
.et{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.et b{font-family:var(--display);font-size:24px;letter-spacing:-.02em}
.est .macros{display:flex;flex-wrap:wrap;gap:6px}
.ag-foot{max-width:620px;width:100%;margin:0 auto;display:flex;gap:10px;align-items:flex-end;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line)}
#agIn,#chIn{flex:1;height:52px;min-height:52px;max-height:140px;resize:none;border-radius:26px;padding:13px 18px;font-size:16px;font-weight:500;line-height:1.4}
.ag-send{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.ag-send:disabled{opacity:.4}
/* Recepty: what to add */
.addchoice{display:flex;flex-direction:column;gap:12px}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:20px;border:2px solid var(--line-2);background:var(--surface);min-height:124px;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--primary)}
.choice:active{transform:scale(.98)}
.choice .ce{font-size:30px;line-height:1;margin-bottom:6px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.choice b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.choice small{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.3}
.seg .num{opacity:.55;margin-left:3px}
/* Lednice: a big fridge with the light on */
.fridge-wrap{position:relative;display:flex;justify-content:center;align-items:stretch;padding:24px 0 30px;isolation:isolate;overflow:hidden;border-radius:var(--r-lg)}
.fridge-wrap::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 55% at 48% 46%,rgba(255,226,140,.6),rgba(255,226,140,.18) 60%,rgba(255,226,140,0) 100%);animation:glowOn 1.6s ease-out both}

"use strict";
/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid6 = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : NaN; };
const fmt = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString("cs-CZ", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt1 = n => (isFinite(n) ? n : 0).toLocaleString("cs-CZ", { maximumFractionDigits: 1 });
const r1 = n => Math.round(n * 10) / 10;
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const coll = new Intl.Collator("cs");

const DOW = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const DOW_S = ["ne","po","út","st","čt","pá","so"];
const MON_G = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const dayDiff = (a, b) => Math.round((dateOf(a) - dateOf(b)) / 864e5);
const shortDate = k => { const d = dateOf(k); return `${d.getDate()}. ${d.getMonth() + 1}.`; };
const longDate = k => { const d = dateOf(k); return `${DOW[d.getDay()]} ${d.getDate()}. ${MON_G[d.getMonth()]}`; };
function dayTitle(k) {
  const diff = dayDiff(k, todayKey());
  if (diff === 0) return "Dnes";
  if (diff === -1) return "Včera";
  if (diff === 1) return "Zítra";
  const d = dateOf(k); return `${DOW_S[d.getDay()]} ${shortDate(k)}`;
}

/* ---------- food math ---------- */
const DEFAULT_GOALS = { kcal: 3000, p: 150, c: 400, f: 90 };
function foodModes(f) {
  const m = [];
  if (f.basis === "g" || f.pieceG > 0) m.push("g");
  if (f.basis === "ks" || f.pieceG > 0) m.push("ks");
  return m;
}
function scale(f, qty, mode) {
  let k = 0;
  if (f.basis === "g") k = mode === "g" ? qty / 100 : qty * (f.pieceG || 0) / 100;
  else k = mode === "ks" ? qty : (f.pieceG ? qty / f.pieceG : 0);
  return { kcal: f.kcal * k, p: f.p * k, c: f.c * k, f: f.f * k };
}
const pieceLabel = f => (f && f.piece) ? f.piece : "ks";
const qtyText = (qty, mode, piece) => mode === "g" ? `${fmt1(qty)} g` : `${fmt1(qty)} ${piece || "ks"}`;
function basisText(f) {
  return f.basis === "g" ? "na 100 g" : `na 1 ${pieceLabel(f)}`;
}
function sumEntries(list) {
  return (list || []).reduce((a, e) => ({ kcal: a.kcal + (e.kcal || 0), p: a.p + (e.p || 0), c: a.c + (e.c || 0), f: a.f + (e.f || 0) }), { kcal: 0, p: 0, c: 0, f: 0 });
}
/* A stand-in food for an entry whose food was deleted: keeps its per-amount ratio. */
function foodForEntry(e) {
  const f = S.lib && S.lib.foods.find(x => x.id === e.foodId);
  if (f) return f;
  const q = e.qty || 1;
  const k = e.mode === "g" ? 100 / q : 1 / q;
  return { id: null, name: e.name, basis: e.mode, piece: e.piece, kcal: e.kcal * k, p: e.p * k, c: e.c * k, f: e.f * k, pieceG: 0 };

const libPath = () => `data/users/${S.uid}/lib`;

function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { S.lsOk = false; } }

        if (e && e.code === "unavailable" && tries++ < 2) { await sleep(400 + Math.random() * 600); continue; }
        toast(e && e.code === "quota_exceeded" ? "Úložiště je plné, záznam se neuložil." : "Změnu se nepodařilo uložit. Zkontrolujte připojení.");
        break;
      }
    }
  }
  w.inflight = false;
}

async function boot() {
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  } catch { db = null; }
  let uid = null;
  try { uid = user ? await user.id() : null; } catch { uid = null; }
  if (db && uid) {
    S.db = db; S.uid = uid;
    try { await initCloud(); S.mode = "cloud"; }
    catch { S.db = null; initLocal(true); }
  } else initLocal(false);
  render();
}

async function getDoc(path) {
  try { return await S.db.doc(path).get(); }
  catch (e) { if (e && e.code === "unavailable") { await sleep(600); return await S.db.doc(path).get(); } throw e; }
}
async function readCatalog() {
  try { const c = await getDoc("catalog/foods"); const items = c.exists ? (c.data().items || []) : []; return items; }
  catch { return []; }
}
function fromCatalog(items) {
  return items.map(it => ({ id: uid6(), name: it.name, basis: it.basis || "g", kcal: +it.kcal || 0, p: +it.p || 0, c: +it.c || 0, f: +it.f || 0, pieceG: +it.pieceG || 0, piece: it.piece || "", uses: 0, last: 0 }));
}
async function initCloud() {
  const snap = await getDoc(libPath());
  if (!snap.exists) {
    const items = await readCatalog();
    S.lib = normLib({ foods: fromCatalog(items), catalogImported: items.length > 0 });
    await S.db.doc(libPath()).set(clone(S.lib));
  } else {
    S.lib = normLib(clone(snap.data()));
    if (!S.lib.catalogImported && S.lib.foods.length === 0) {
      const items = await readCatalog();
      if (items.length) { S.lib.foods = fromCatalog(items); S.lib.catalogImported = true; S.mode = "cloud"; persist("lib"); }
    }
  }
  S.mode = "cloud"; /* from here on, changes during start-up (starter recipes, migrations) are saved */
  await importRecipes();
  if (S.lib.recipes.some(r => r._migrated)) { S.lib.recipes.forEach(r => delete r._migrated); persist("lib"); }
  S.db.doc(libPath()).onSnapshot(s => {
    if (busy(libPath()) || !s.exists) return;
    S.lib = normLib(clone(s.data()));
    render();
  }, () => {});
}
function normLib(l) {
  l = l || {};
  return { goals: { ...DEFAULT_GOALS, ...(l.goals || {}) }, foods: l.foods || [], meals: l.meals || [], weights: l.weights || [], recipes: (l.recipes || []).map(r => normRecipe(r, l.foods || [])), fridge: Array.isArray(l.fridge) ? l.fridge : [], diet: Array.isArray(l.diet) ? l.diet : [], catalogImported: !!l.catalogImported, recipesCatalogV: l.recipesCatalogV || (l.recipesImported ? 1 : 0) };
}
/* Starter recipes live in a shared catalog doc; ingredients link to foods by name. Each catalog version is imported once. */
async function importRecipes() {
  let cat = null;
  try { const c = await getDoc("catalog/recipes"); cat = c.exists ? c.data() : null; } catch { return; }
  if (!cat || !(cat.items || []).length) return;
  const ver = +cat.version || 1;
  if (S.lib.recipesCatalogV >= ver) return;
  cat.items.forEach(it => {
    if ((+it.since || 1) <= S.lib.recipesCatalogV) return;
    if (S.lib.recipes.some(r => norm(r.name) === norm(it.title || it.name))) return;
    const r = recipeFromJSON(it, true);
    if (r) S.lib.recipes.push(r);
  });
  S.lib.recipesCatalogV = ver; persist("lib");
}

}

}

/* Shrink a picked photo to a small JPEG so it fits in one document. */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 720, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.78, out = c.toDataURL("image/jpeg", q);
      while (out.length > 170000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function addEntriesToDay(k, newEntries, msg) {

  bumpUses(newEntries);

}
function bumpUses(entries) {
  const now = Date.now(); let changed = false;
  entries.forEach(e => { const f = S.lib.foods.find(x => x.id === e.foodId); if (f) { f.uses = (f.uses || 0) + 1; f.last = now; f.lastQty = e.qty; f.lastMode = e.mode; changed = true; } });
  if (changed) persist("lib");
}
function deleteEntry(id) {
  const k = state.day, before = clone(dayEntries(k) || []);
  const e = before.find(x => x.id === id); if (!e) return;
  setDayEntries(k, before.filter(x => x.id !== id));

}
async function copyPrevDay() {

  if (!d) { toast("Předchozí den se nepodařilo načíst."); return; }

  const copies = d.entries.map(e => ({ ...clone(e), id: uid6() }));
  addEntriesToDay(k, copies, `Zkopírováno ${copies.length} ${copies.length === 1 ? "položka" : copies.length < 5 ? "položky" : "položek"}`);
}

/* ---------- sheets (add food, amount, meal editor, food form) ---------- */
const sheetStack = [];
const topSheet = () => sheetStack[sheetStack.length - 1];
/* The meal or recipe editor that a picked ingredient goes into. */
function editorFrame() { for (let i = sheetStack.length - 1; i >= 0; i--) if (sheetStack[i].type === "meal" || sheetStack[i].type === "recipeEdit") return sheetStack[i]; return null; }
function openSheet(frame) { sheetStack.push(frame); renderSheet(); }
function popSheet() { sheetStack.pop(); if (sheetStack.length) renderSheet(); else closeSheet(); }
function closeSheet() { sheetStack.length = 0; const s = $("#sheet"); s.hidden = true; s.innerHTML = ""; document.body.style.overflow = ""; render(); }

function sortedFoods(q) {
  const nq = norm(q).trim();
  let arr = S.lib.foods.slice();
  if (nq) arr = arr.filter(f => norm(f.name).includes(nq));
  return arr.sort((a, b) => (b.uses || 0) - (a.uses || 0) || (b.last || 0) - (a.last || 0) || coll.compare(a.name, b.name));
}
function foodMeta(f) { return `${fmt(f.kcal)} kcal · B ${fmt1(f.p)} g · ${basisText(f)}`; }
function foodItemHTML(f, act) {
  return `<button class="fitem" data-act="${act}" data-id="${f.id}">
    ${emo(foodEmoji(f))}
    <div class="main"><div class="name">${esc(f.name)}</div><div class="meta num">${esc(foodMeta(f))}</div></div>
    ${f.uses ? `<span class="freq num">${f.uses}×</span>` : ""}
    <span class="plus" aria-hidden="true">${IC.plus}</span></button>`;
}
function pickListHTML(q, act) {
  const ed = editorFrame();
  const arr = sortedFoods(q).filter(f => !(ed && ed.type === "recipeEdit" && f.recipeId === ed.draft.id));
  if (!S.lib.foods.length) return `<div class="empty"><b>Zatím nemáte žádné potraviny</b>Přidejte je na kartě Potraviny.</div>`;
  if (!arr.length) return `<div class="empty"><b>Nic nenalezeno</b>Potravinu „${esc(q)}“ si můžete přidat na kartě Potraviny.</div>`;
  if (norm(q).trim()) return arr.map(f => foodItemHTML(f, act)).join("");
  const top = arr.filter(f => f.uses), rest = arr.filter(f => !f.uses);
  return (top.length ? `<div class="section-l">Nejčastější</div>` + top.map(f => foodItemHTML(f, act)).join("") : "")
    + (rest.length ? `<div class="section-l">${top.length ? "Ostatní" : "Všechny potraviny"}</div>` + rest.map(f => foodItemHTML(f, act)).join("") : "");
}
function mealTotals(m) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  m.items.forEach(it => { const f = S.lib.foods.find(x => x.id === it.foodId); if (f) { const v = scale(f, it.qty, it.mode); t.kcal += v.kcal; t.p += v.p; t.c += v.c; t.f += v.f; } });
  return t;
}

function renderSheet() {
  const fr = topSheet(); if (!fr) return;
  const s = $("#sheet");
  /* Keep the scroll position when the same screen re-draws (servings, emoji, steps…). */
  const prevBody = s.querySelector(".sheet-body"), keepScroll = s._frame === fr && prevBody ? prevBody.scrollTop : 0;
  s._frame = fr;
  s.hidden = false; s.className = "sheet"; document.body.style.overflow = "hidden";
  const back = sheetStack.length > 1
    ? `<button class="iconbtn" data-act="back" aria-label="Zpět">${IC.back}</button>`
    : `<button class="iconbtn" data-act="close" aria-label="Zavřít">${IC.close}</button>`;
  let title = "", body = "";
  if (fr.type === "add" || fr.type === "pick") {
    title = fr.type === "add" ? `Přidat jídlo · ${dayTitle(state.day)}` : "Vybrat potravinu";
    const seg = fr.type === "add" ? `<div class="seg" role="group" aria-label="Co přidat">
        <button data-act="seg" data-v="foods" aria-pressed="${fr.seg !== "meals"}">Potraviny</button>
        <button data-act="seg" data-v="meals" aria-pressed="${fr.seg === "meals"}">Uložená jídla</button></div>` : "";
    if (fr.type === "add" && fr.seg === "meals") body = seg + mealsListHTML();
    else body = seg + `<div class="search">${IC.search}<input class="inp" id="pickQ" type="search" placeholder="Hledat potravinu…" autocomplete="off" value="${esc(fr.q || "")}"></div>
      <div class="flist" id="pickList">${pickListHTML(fr.q || "", pickAct(fr))}</div>`;
  } else if (fr.type === "amount") { title = fr.food.name; body = amountHTML(fr); }
  else if (fr.type === "meal") { title = fr.isNew ? "Nové jídlo" : "Upravit jídlo"; body = mealEditHTML(fr); }
  else if (fr.type === "food") { title = fr.isNew ? "Nová potravina" : "Upravit potravinu"; body = foodFormHTML(fr); }
  else if (fr.type === "recipe") { const r = curRecipe(fr.id); if (!r) { popSheet(); return; } title = r.name; body = recipeDetailHTML(r); }
  else if (fr.type === "recipeEdit") { title = fr.isNew ? "Nový recept" : "Upravit recept"; body = recipeEditHTML(fr); }
  else if (fr.type === "ingEdit") { title = fr.isNew ? "Nová surovina" : "Upravit surovinu"; body = ingEditHTML(fr); }
  else if (fr.type === "import") { title = "Vložit recept z JSON"; body = importHTML(); }
  s.innerHTML = `<div class="sheet-head">${back}<h2>${esc(title)}</h2></div><div class="sheet-body"><div class="sheet-inner">${body}</div></div>`;
  if (keepScroll) s.querySelector(".sheet-body").scrollTop = keepScroll;
  if (fr.type === "amount") updateAmount();
  hydratePhotos();
}
const pickAct = fr => fr.type === "add" ? "pickFood" : fr.for === "ing" ? "pickForIng" : fr.for === "extra" ? "pickForExtra" : "pickForMeal";

/* --- amount --- */
function startAmount(food, opts = {}) {
  const ms = foodModes(food);
  let mode = opts.mode, qty = opts.qty;
  if (!mode) {
    if (food.lastMode && ms.includes(food.lastMode)) { mode = food.lastMode; qty = food.lastQty; }
    else if (ms.includes("ks")) { mode = "ks"; qty = 1; }
    else { mode = "g"; qty = 100; }
  }
  openSheet({ type: "amount", food, mode, qty: qty || (mode === "g" ? 100 : 1), ...opts, mode, qty: qty || (mode === "g" ? 100 : 1) });
}
function amountHTML(fr) {

  return `<div class="amthead">${f.id ? emo(foodEmoji(f), "xl") : emo(guessEmoji(f.name), "xl")}<div class="note num">${esc(foodMeta(f))}</div></div>
    ${segHTML}

      <button class="step" data-act="amtStep" data-v="1" aria-label="Více">+</button></div></div>

function updateAmount() {
  const fr = topSheet(); if (!fr || fr.type !== "amount") return;
  const inp = $("#amtQty"); const q = num(inp.value);
  fr.qty = isFinite(q) && q > 0 ? q : 0;
  const v = scale(fr.food, fr.qty, fr.mode);
  $("#amtResult").innerHTML = `<div class="kc"><b class="num">${fmt(v.kcal)}</b><small>kcal</small></div>
    <div class="pr"><b class="num">${fmt1(r1(v.p))}</b><small>bílk. g</small></div>
    <div><b class="num">${fmt1(r1(v.c))}</b><small>sach. g</small></div>
    <div><b class="num">${fmt1(r1(v.f))}</b><small>tuky g</small></div>`;

}
function makeEntry(f, qty, mode, id, meal) {
  const v = scale(f, qty, mode);
  return { id: id || uid6(), foodId: f.id, name: f.name, qty: r1(qty), mode, piece: pieceLabel(f), kcal: r1(v.kcal), p: r1(v.p), c: r1(v.c), f: r1(v.f), ...(meal ? { meal } : {}) };
}
function amountConfirm() {
  const fr = topSheet(); updateAmount(); if (!(fr.qty > 0)) return;
  if (fr.target === "extra") {
    const r = curRecipe(fr.rid); if (!r) { closeSheet(); return; }
    const f = fr.food, unit = fr.mode === "g" ? "g" : (f.piece && f.piece !== "ks" ? f.piece : null);
    rv(r).extra.push({ id: uid6(), foodId: f.id, name: lcFirst(f.name), amount: r1(fr.qty), unit });
    while (topSheet() && !(topSheet().type === "recipe" && topSheet().id === fr.rid)) sheetStack.pop();
    if (sheetStack.length) renderSheet(); else closeSheet();
    toast(`Přidáno navíc: ${f.name}`); return;
  }
  if (fr.target === "meal") {
    const mf = editorFrame();
    const item = { foodId: fr.food.id, qty: r1(fr.qty), mode: fr.mode };
    if (fr.itemIndex != null) mf.draft.items[fr.itemIndex] = item; else mf.draft.items.push(item);
    while (topSheet() && topSheet() !== mf) sheetStack.pop();
    renderSheet(); return;
  }
  const k = state.day;
  if (fr.entryId) {
    const list = clone(dayEntries(k) || []); const i = list.findIndex(e => e.id === fr.entryId);
    if (i >= 0) { list[i] = makeEntry(fr.food, fr.qty, fr.mode, fr.entryId, list[i].meal); if (!fr.food.id) list[i].foodId = list[i].foodId || null; }
    setDayEntries(k, list); closeSheet(); toast("Změna uložena");
  } else {
    const e = makeEntry(fr.food, fr.qty, fr.mode);
    closeSheet(); addEntriesToDay(k, [e], `Přidáno: ${e.name}`);
  }
}

/* ---------- WEIGHT ---------- */
function sortedWeights() { return S.lib.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1); }
function changeOver(ws, days) {
  if (ws.length < 2) return null;
  const last = ws[ws.length - 1], target = addDays(last.date, -days);
  let base = null; for (const w of ws) { if (w.date <= target) base = w; else break; }
  if (!base) { const first = ws[0]; if (first.date < last.date && dayDiff(last.date, first.date) >= Math.ceil(days / 2)) base = first; }
  return base ? { d: last.kg - base.kg, from: base.date } : null;
}
function wStat(label, ch) {
  if (!ch) return `<div class="wstat"><small>${label}</small><b>—</b><span>málo dat</span></div>`;
  const cls = ch.d < -0.05 ? "down" : ch.d > 0.05 ? "up" : "";
  return `<div class="wstat"><small>${label}</small><b class="num ${cls}">${ch.d > 0 ? "+" : ch.d < 0 ? "−" : ""}${fmt(Math.abs(ch.d), 1)} kg</b><span class="num">od ${shortDate(ch.from)}</span></div>`;
}
function niceStep(range) { const raw = range / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function chartSVG(ws, W, H = 210) {
  const L = 40, R = 14, T = 14, B = 26;
  if (!ws.length) return `<div class="empty"><b>Zatím žádná data</b>Zapište svou první váhu výše.</div>`;
  const t0 = dateOf(ws[0].date).getTime(), t1 = dateOf(ws[ws.length - 1].date).getTime();
  let lo = Math.min(...ws.map(w => w.kg)), hi = Math.max(...ws.map(w => w.kg));
  if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - 0.5; hi = m + 0.5; }
  const st = niceStep(hi - lo); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const x = t => t1 === t0 ? (L + (W - L - R) / 2) : L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let grid = "";
  for (let v = lo; v <= hi + 1e-9; v += st) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt1(r1(v))}</text>`;
  const pts = ws.map(w => [x(dateOf(w.date).getTime()), y(w.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = pts.length > 1 ? `${line} L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z` : "";
  const lp = pts[pts.length - 1];
  const xl = [`<text x="${L}" y="${H - 6}" text-anchor="start">${shortDate(ws[0].date)}</text>`];
  if (ws.length > 1) xl.push(`<text x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(ws[ws.length - 1].date)}</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="Graf vývoje váhy">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--primary);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--primary);stop-opacity:0"/></linearGradient></defs>
    ${grid}${area ? `<path d="${area}" fill="url(#wg)"/>` : ""}
    <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"/>`).join("") : ""}
    <circle cx="${lp[0]}" cy="${lp[1]}" r="6" fill="var(--primary-deep)" stroke="var(--bg)" stroke-width="2.5"/>
    ${xl.join("")}</svg>`;
}

/* ---------- COOKBOOK: recipe model ----------
   recipe = { v:2, id, name, description, emoji, photo, servings (base), mode: "items"|"manual", manual:{kcal,p,c,f per serving},
              cookedG, ingredients:[{id, name, amount, unit, foodId}], steps:[{id, title, content, timer_seconds}], notes, foodId }
   unit: "g" | "ml" | "lžíce" | "lžička" | null (pieces; the counting word is in the name) | a food's own piece word */
const lcFirst = s => s ? s.charAt(0).toLocaleLowerCase("cs") + s.slice(1) : s;
const UNITS = ["g", "ml", null, "lžíce", "lžička"];
const unitLabel = u => u == null ? "ks" : u;
function normRecipe(r, foods) {
  if (!r) return r;
  if (r.v === 2) return { description: "", notes: "", emoji: "", photo: 0, cookedG: 0, mode: "items", manual: { kcal: 0, p: 0, c: 0, f: 0 }, foodId: null, ...r, ingredients: r.ingredients || [], steps: r.steps || [] };
  foods = foods || (S.lib && S.lib.foods) || [];
  const ingredients = (r.items || []).map((it, i) => {
    const f = foods.find(x => x.id === it.foodId); if (!f) return null;
    const unit = it.mode === "g" ? "g" : (f.piece && f.piece !== "ks" ? f.piece : null);
    return { id: "i" + (i + 1), name: lcFirst(f.name), amount: it.qty, unit, foodId: f.id };
  }).filter(Boolean);
  const steps = String(r.steps || "").split(/\n+/).map(t => t.trim()).filter(Boolean).map((t, i) => ({ id: "s" + (i + 1), title: "", content: t, timer_seconds: 0 }));
  return { v: 2, id: r.id, name: r.name, description: "", emoji: r.emoji || "", photo: r.photo || 0, servings: r.servings || 1, mode: r.mode || "items",
    manual: r.manual || { kcal: 0, p: 0, c: 0, f: 0 }, cookedG: r.cookedG || 0, ingredients, steps, notes: "", foodId: r.foodId || null, _migrated: true };
}
const servCount = r => Math.max(0.5, +r.servings || 1);
const ingMode = ing => (ing.unit === "g" || ing.unit === "ml") ? "g" : "ks";
const ingFood = ing => ing.foodId ? S.lib.foods.find(f => f.id === ing.foodId) || null : null;
function ingMacros(ing, mult = 1) {
  const f = ingFood(ing); if (!f) return null;
  const md = ingMode(ing); if (!foodModes(f).includes(md)) return null;
  return scale(f, ing.amount * mult, md);
}
function recipeTotals(r) {
  const s = servCount(r);
  if (r.mode === "manual") { const m = r.manual || {}; return { kcal: (+m.kcal || 0) * s, p: (+m.p || 0) * s, c: (+m.c || 0) * s, f: (+m.f || 0) * s }; }
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  r.ingredients.forEach(ing => { const v = ingMacros(ing); if (v) { t.kcal += v.kcal; t.p += v.p; t.c += v.c; t.f += v.f; } });
  return t;
}
function recipePer(r) { const t = recipeTotals(r), s = servCount(r); return { kcal: t.kcal / s, p: t.p / s, c: t.c / s, f: t.f / s }; }
/* Weight of the whole dish: the cooked weight if given, otherwise the sum of the ingredients we can weigh. */
function recipeWeight(r) {
  if (+r.cookedG > 0) return +r.cookedG;
  let g = 0;
  r.ingredients.forEach(ing => {
    if (ing.unit === "g" || ing.unit === "ml") g += +ing.amount || 0;
    else { const f = ingFood(ing); if (f && f.pieceG) g += (+ing.amount || 0) * f.pieceG; }
  });
  return g;
}
const recipeFood = r => r.foodId ? S.lib.foods.find(f => f.id === r.foodId) || null : null;
function syncRecipeFood(r) {
  const fd = recipeFood(r); if (!fd) return null;
  const per = recipePer(r), w = recipeWeight(r);
  Object.assign(fd, { name: r.name, emoji: r.emoji || "", basis: "ks", piece: "porce", kcal: r1(per.kcal), p: r1(per.p), c: r1(per.c), f: r1(per.f), pieceG: w ? r1(w / servCount(r)) : 0, recipeId: r.id });
  if (fd.lastMode && !foodModes(fd).includes(fd.lastMode)) delete fd.lastMode;
  return fd;
}
function addRecipeToFoods(r) {
  let fd = recipeFood(r);
  if (!fd) { fd = { id: uid6(), uses: 0, last: 0, recipeId: r.id }; S.lib.foods.push(fd); r.foodId = fd.id; }
  syncRecipeFood(r); persist("lib"); return fd;
}

/* ---------- amounts: rounding & Czech wording ---------- */
const FRAC = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
function fracText(v, step) {
  let r = Math.round(v / step) * step;
  if (r === 0 && v > 0) r = step;
  const w = Math.floor(r + 1e-9), f = Math.round((r - w) * 4) / 4;
  const fs = FRAC[f] || "";
  return { text: w ? `${w}${fs}` : (fs || "0"), value: r };
}
function unitWord(u, n) {
  const whole = Number.isInteger(n);
  if (u === "lžíce") return whole && n >= 5 ? "lžic" : "lžíce";
  if (u === "lžička") return n === 1 ? "lžička" : whole && n >= 5 ? "lžiček" : "lžičky";
  return u;
}
/* -> { q: "1½", u: "lžíce" } ; u is "" for pieces */
function fmtQty(amount, unit) {
  if (unit === "g" || unit === "ml") {
    let v = Math.round(amount); if (v < 1 && amount > 0) v = 1;
    if (v >= 1000) return { q: (amount / 1000).toLocaleString("cs-CZ", { maximumFractionDigits: 2 }), u: unit === "g" ? "kg" : "l" };
    return { q: String(v), u: unit };
  }
  const { text, value } = fracText(amount, unit === "lžíce" || unit === "lžička" ? 0.25 : 0.5);
  return { q: text, u: unit ? unitWord(unit, value) : "" };
}
/* The editable base value shown in the amount popover (always in the recipe's own unit). */
function editValue(amount, unit) {
  if (unit === "g" || unit === "ml") return Math.max(1, Math.round(amount));
  return fracText(amount, unit === "lžíce" || unit === "lžička" ? 0.25 : 0.5).value;
}
function ingText(ing, m = 1) { const { q, u } = fmtQty((+ing.amount || 0) * m, ing.unit); return `${q}${u ? " " + u : ""} ${ing.name}`; }
function ingParts(ing, m = 1) { const { q, u } = fmtQty((+ing.amount || 0) * m, ing.unit); return { qty: `${q}${u ? " " + u : ""}`, name: ing.name }; }
const ingEmoji = ing => { const f = ingFood(ing); return f ? foodEmoji(f) : guessEmoji(ing.name); };
const porceWord = n => n === 1 ? "porce" : (Number.isInteger(n) && n >= 5) ? "porcí" : "porce";
const surWord = n => n === 1 ? "surovina" : n >= 2 && n <= 4 ? "suroviny" : "surovin";
const receptWord = n => n === 1 ? "recept" : n >= 2 && n <= 4 ? "recepty" : "receptů";
function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
const totalTimer = r => r.steps.reduce((a, s) => a + (+s.timer_seconds || 0), 0);
function macroChips(v) {
  return `<span class="mchip k num">${fmt(v.kcal)} kcal</span><span class="mchip p num">B ${fmt1(r1(v.p))} g</span><span class="mchip num">S ${fmt1(r1(v.c))} g</span><span class="mchip num">T ${fmt1(r1(v.f))} g</span>`;
}

/* ---------- JSON import (the format from the recipe spec) ---------- */
function cleanUnit(u) {
  if (u == null) return null;
  const n = norm(String(u)).trim().replace(/\.$/, "");
  if (!n || n === "ks" || n === "kus" || n === "kusy" || n === "pcs") return null;
  if (n === "g" || n === "gram" || n === "gramy") return "g";
  if (n === "kg") return "kg";
  if (n === "ml") return "ml";
  if (n === "l" || n === "litr") return "l";
  if (/^(lzice|lzic|pl|tbsp)$/.test(n)) return "lžíce";
  if (/^(lzicka|lzicky|lzicek|cl|kl|tsp)$/.test(n)) return "lžička";
  return String(u).trim();
}
function recipeFromJSON(o, fromCatalog) {
  if (!o || typeof o !== "object") return null;
  const name = String(o.title || o.name || "").trim(); if (!name) return null;
  const used = new Set();
  const safeId = (raw, prefix, i) => { let id = String(raw ?? "").replace(/[^\w-]/g, "").slice(0, 24) || `${prefix}${i + 1}`; while (used.has(id)) id += "x"; used.add(id); return id; };
  const ingredients = (Array.isArray(o.ingredients) ? o.ingredients : []).map((x, i) => {
    if (!x || !x.name) return null;
    let unit = cleanUnit(x.unit), amount = num(x.amount);
    if (!isFinite(amount) || amount < 0) amount = 0;
    if (unit === "kg") { unit = "g"; amount *= 1000; } else if (unit === "l") { unit = "ml"; amount *= 1000; }
    const ing = { id: safeId(x.id, "i", i), name: String(x.name).trim(), amount, unit, foodId: null };
    const want = norm(x.food || x.name).trim();
    const f = S.lib.foods.find(fd => norm(fd.name).trim() === want);
    if (f && foodModes(f).includes(ingMode(ing))) ing.foodId = f.id;
    return ing;
  }).filter(Boolean);
  const steps = (Array.isArray(o.steps) ? o.steps : []).map((st, i) => {
    if (typeof st === "string") st = { content: st };
    if (!st || !(st.content || st.title)) return null;
    return { id: safeId(st.id, "s", i), title: String(st.title || "").trim(), content: String(st.content || "").trim(), timer_seconds: Math.max(0, Math.round(num(st.timer_seconds) || 0)) };
  }).filter(Boolean);
  const linked = ingredients.some(i => i.foodId);
  return { v: 2, id: uid6(), name, description: String(o.description || "").trim(), emoji: String(o.emoji || "").trim().slice(0, 8), photo: 0,
    servings: Math.max(0.5, num(o.base_servings ?? o.servings) || 1), mode: linked ? "items" : "manual", manual: { kcal: 0, p: 0, c: 0, f: 0 },
    cookedG: Math.max(0, num(o.cooked_g) || 0), ingredients, steps, notes: String(o.notes || "").trim(), foodId: null };
}

/* ---------- LEDNICE: what's in the fridge -> which recipes fit ---------- */
const STAPLE = /^(sul|sol|pepr|voda|vody|vodu)\b|\b(sul|pepr|voda)$/;
const stemWords = t => norm(t).replace(/\([^)]*\)/g, " ").split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !/\d/.test(w))
  .map(w => /^(vajic|vajec)/.test(w) ? "vejce" : w);
function wordsMatch(a, b) {
  if (a === b) return true;
  const sa = a.slice(0, Math.max(3, a.length - 2)), sb = b.slice(0, Math.max(3, b.length - 2));
  return a.startsWith(sb) || b.startsWith(sa);
}
/* Does the fridge item cover this recipe ingredient? Every word of the item must appear in the ingredient. */
function covers(item, ing) {
  const iw = stemWords(item); if (!iw.length) return false;
  const names = [ing.name]; const f = ingFood(ing); if (f) names.push(f.name);
  return names.some(n => { const nw = stemWords(n); return iw.every(w => nw.some(x => wordsMatch(w, x))); });
}
function recipeMatch(r, items) {
  const need = r.ingredients.filter(i => !STAPLE.test(norm(i.name).trim()));
  const have = need.filter(i => items.some(it => covers(it, i)));
  return { have: have.length, total: need.length, missing: need.filter(i => !have.includes(i)) };
}
const inFridge = n => S.lib.fridge.some(x => norm(x) === norm(n));
function fridgeAdd(list) {
  let added = 0;
  list.map(x => x.trim()).filter(Boolean).forEach(x => { if (!inFridge(x) && S.lib.fridge.length < 40) { S.lib.fridge.push(x.slice(0, 40)); added++; } });
  if (added) { persist("lib"); updateFridge(); }
  return added;
}
function fridgeRemove(n) { S.lib.fridge = S.lib.fridge.filter(x => norm(x) !== norm(n)); persist("lib"); updateFridge(); }

function matchHTML(m) {
  if (!m || !m.total) return "";

  return `<span class="match some">Máš ${m.have} z ${m.total} · chybí ${esc(miss)}</span>`;
}

  const tt = totalTimer(r);

  return `<button class="rcard" data-act="openRecipe" data-id="${r.id}">
    <div class="top"><div class="thumb" aria-hidden="true">${esc(recipeEmoji(r))}${photoTag(r)}</div>

/* ---------- LEDNICE: a big lit-up fridge with what you have in it ---------- */
const PRODUCE = new Set(["🥔","🍠","🌽","🥦","🥬","🥒","🥕","🍅","🫑","🧅","🧄","🥑","🍌","🍎","🍐","🍊","🍋","🍓","🫐","🍇","🍉","🍍","🥝","🍑","🍒","🥥","🫘"]);
const DOORISH = new Set(["🥛","🧃","🍺","🍷","☕","🍵","🥤","🧈","🥚","🫒","🍯"]);
/* Put each item on a shelf, in the crisper drawer or in the door, the way you would stock a real fridge. */
function stockFridge(items) {
  const shelves = [[], [], []], crisper = [], door = [[], [], []];
  const capS = 4, capC = 4, capD = 2; let extra = 0;
  const put = (it, where) => {
    if (where === "crisper") { if (crisper.length < capC) { crisper.push(it); return true; } return false; }
    const rows = where === "door" ? door : shelves, cap = where === "door" ? capD : capS;
    for (const r of rows) if (r.length < cap) { r.push(it); return true; }
    return false;
  };
  items.forEach(name => {
    const e = guessEmoji(name), it = { name, e };
    const pref = PRODUCE.has(e) ? "crisper" : DOORISH.has(e) ? "door" : "shelf";
    if (!(put(it, pref) || put(it, "shelf") || put(it, "door") || put(it, "crisper"))) extra++;
  });
  return { shelves, crisper, door, extra };
}
const fItem = (it, small) => `<button class="fi${small ? " sm" : ""}" data-act="frDel" data-v="${esc(it.name)}" title="${esc(it.name)}" aria-label="Vyndat ${esc(it.name)}">
  <span class="fe" aria-hidden="true">${esc(it.e)}</span>${small ? "" : `<span class="fl">${esc(it.name)}</span>`}</button>`;
function fridgeInsideHTML() {
  const st = stockFridge(S.lib.fridge), empty = !S.lib.fridge.length;
  return `${st.shelves.map((r, i) => `<div class="shelf">${r.map(it => fItem(it)).join("")}${empty && i === 1 ? `<span class="fr-empty">Zatím prázdno.<br>Napiš níž, co v ní máš.</span>` : ""}</div>`).join("")}
    <div class="crisper">${st.crisper.map(it => fItem(it)).join("")}</div>
    ${st.extra ? `<span class="fr-more">+ ${st.extra} dalších</span>` : ""}`;
}
const fridgeDoorHTML = () => stockFridge(S.lib.fridge).door.map(r => `<div class="dbin">${r.map(it => fItem(it, true)).join("")}</div>`).join("");
/* A recipe written by the AI (JSON in the spec format). Macros come from the user's own foods when every
   real ingredient matches one of them; otherwise from the AI's per-serving estimate. */
function fromAIRecipe(o) {
  const r = recipeFromJSON(o); if (!r) return null;
  const ps = (o && o.per_serving) || {}, n = v => Math.max(0, Math.round(+v || 0));
  const need = r.ingredients.filter(i => !STAPLE.test(norm(i.name).trim()) && +i.amount > 0);
  const allLinked = need.length > 0 && need.every(i => ingMacros(i));
  r.manual = { kcal: n(ps.kcal), p: n(ps.p), c: n(ps.c), f: n(ps.f) };
  r.mode = allLinked || !(r.manual.kcal || r.manual.p) ? "items" : "manual";
  r.timeMin = n(o && o.time_min) || 0;

}

/* ---------- interactive recipe view ---------- */
/* recipeId -> { m: multiplier, checked: {ingId: true}, delta: {ingId: extra amount}, extra: [one-off ingredients] }
   delta and extra are tweaks for this cooking only; the saved recipe never changes. */
const RV = {};
const rv = r => { const v = RV[r.id] || (RV[r.id] = { m: 1, checked: {} }); v.delta = v.delta || {}; v.extra = v.extra || []; return v; };
const ingAmt = (r, ing) => Math.max(0, (+ing.amount || 0) * rv(r).m + (rv(r).delta[ing.id] || 0));
/* What the tweaks add: their macros, a short description, and the adjusted per-portion values. */
function tweakInfo(r) {
  const v = rv(r), add = { kcal: 0, p: 0, c: 0, f: 0 }, parts = []; let unknown = false;
  const plus = (ing, amt) => { const mm = ingMacros({ ...ing, amount: amt }); if (mm) { add.kcal += mm.kcal; add.p += mm.p; add.c += mm.c; add.f += mm.f; } else unknown = true; };
  r.ingredients.forEach(ing => { const d = v.delta[ing.id]; if (!d) return; plus(ing, d); const q = fmtQty(Math.abs(d), ing.unit); parts.push(`${d > 0 ? "+" : "−"}${q.q}${q.u ? " " + q.u : ""} ${ing.name}`); });

function tick() {
  let changed = false;
  TIMERS.forEach(t => {
    if (t.st === "run" && t.endAt <= Date.now()) { t.st = "done"; t.left = 0; changed = true; ring(); toast(`⏰ ${t.label}: hotovo`); }
  });
  if (changed) { timersChanged(); return; }
  TIMERS.forEach(t => {
    if (t.st !== "run") return;
    const txt = fmtClock(timerLeft(t));
    document.querySelectorAll(`[data-tdisp="${t.key}"]`).forEach(el => { if (el.textContent !== txt) el.textContent = txt; });
    document.querySelectorAll(`[data-tbtn="${t.key}"] span`).forEach(el => { if (el.textContent !== txt) el.textContent = txt; });

  const hasPrep = r.ingredients.length > 0, n = cookPages(r);
  cook.idx = Math.max(0, Math.min(cook.idx, n - 1));
  const i = cook.idx, isPrep = hasPrep && i === 0, si = i - (hasPrep ? 1 : 0), st = isPrep ? null : r.steps[si];
  const label = isPrep ? "Příprava" : `Krok ${si + 1} z ${r.steps.length}`;

    ? `<h2>Připrav si suroviny</h2>

(function () {
  const el = document.getElementById("cook");
  el.addEventListener("click", e => {
    const c = e.target.closest("[data-cact]");
    if (c) {
      const a = c.dataset.cact;
      if (a === "close") closeCook();
      else if (a === "prev") { cook.idx--; renderCook(); }
      else if (a === "next") { const r = curRecipe(cook.rid); if (cook.idx >= cookPages(r) - 1) { closeCook(); toast("Dobrou chuť!"); } else { cook.idx++; renderCook(); } }
      return;
    }
    const b = e.target.closest("[data-act]"); if (!b) return;
    recipeAction(b.dataset.act, b);
  });
  document.addEventListener("keydown", e => {
    if (!cook || popState) return;
    if (e.key === "Escape") { e.stopImmediatePropagation(); closeCook(); }
    else if (e.key === "ArrowRight" && !/INPUT|TEXTAREA/.test(e.target.tagName)) $('[data-cact="next"]').click();
    else if (e.key === "ArrowLeft" && !/INPUT|TEXTAREA/.test(e.target.tagName)) { const p = $('[data-cact="prev"]'); if (!p.disabled) p.click(); }

async function collectBackup() {
  const out = { app: "makro-denik", version: 1, exportedAt: new Date().toISOString(), lib: clone(S.lib), days: {}, photos: {} };
  if (S.mode === "cloud") {
    const snap = await S.db.collection(`data/users/${S.uid}`).limit(1000).get();
    snap.docs.forEach(d => {
      const id = d.id, data = d.data() || {};
      if (id.startsWith("d-")) out.days[id.slice(2)] = data.entries || [];
      else if (id.startsWith("img-") && data.data) out.photos[id.slice(4)] = data.data;
    });
  } else {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i); if (!k || !k.startsWith(LS)) continue;
        const rest = k.slice(LS.length), v = JSON.parse(localStorage.getItem(k));
        if (rest.startsWith("d:")) out.days[rest.slice(2)] = (v && v.entries) || [];
        else if (rest.startsWith("img:") && v) out.photos[rest.slice(4)] = v;
      }
    } catch {}
  }
  Object.keys(S.days).forEach(k => { if (S.days[k] && !(k in out.days)) out.days[k] = S.days[k].entries || []; });
  Object.keys(out.days).forEach(k => { if (!out.days[k].length) delete out.days[k]; });
  return out;
}

<script type="module">

async function start() {

function withTimeout(p, ms, what) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + " – vypršel čas")), ms))]); }

/* ---------- storage: the same doc()/collection() calls the app makes inside Claude ---------- */
function wrapSnap(s) {

    return { id: snap.id, path, get: async () => snap, onSnapshot: next => { setTimeout(() => next(snap)); return () => {}; },
      set: async () => {}, update: async () => {}, delete: async () => {} };
  };

    doc(path) {
      if (path.startsWith("catalog/")) return staticDoc(path);
      const ref = doc(fdb, path);
      return {
        id: ref.id, path,
        get: async () => { try { return wrapSnap(await getDoc(ref)); } catch (e) { throw errOf(e); } },
        set: async data => { try { await setDoc(ref, data); } catch (e) { throw errOf(e); } },
        update: async data => { try { await updateDoc(ref, data); } catch (e) { throw errOf(e); } },
        delete: async () => { try { await deleteDoc(ref); } catch (e) { throw errOf(e); } },
        onSnapshot: (next, error) => onSnapshot(ref, s => next(wrapSnap(s)), e => { if (error) error(errOf(e)); }),
        collection: p => api.collection(`${path}/${p}`),
