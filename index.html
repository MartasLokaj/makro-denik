      const make = q => ({
        path,
        limit: n => make(query(q, limit(n))),
        get: async () => { try { const s = await getDocs(q); return { docs: s.docs.map(wrapSnap), size: s.size, empty: s.empty }; } catch (e) { throw errOf(e); } },
        doc: id => api.doc(`${path}/${id || Math.random().toString(36).slice(2, 12)}`),
      });
      return make(collection(fdb, path));
    },
  };

}

            lastErr = e;
            if (isNotFound(e)) { dead.add(chain[i]); console.warn(`Gemini: model ${chain[i]} není dostupný`); break; }
            if (isBusy(e)) {
              if (attempt === 0) { console.warn(`Gemini: ${chain[i]} je přetížený, zkouším znovu`); await Promise.race([sleep(1500), aborted]); continue; }
              busyFallback = true; console.warn(`Gemini: ${chain[i]} je pořád přetížený, zkouším jiný model`); break;
            }
            throw e;
          }
        }
      }
      throw lastErr || { code: "upstream_error", message: "no model" };
    } catch (e) {
      if (e && e.code && !(e instanceof Error)) throw e;
      console.warn("Gemini:", e);
      throw mapErr(e);
    } finally { if (signal) signal.removeEventListener("abort", onAbort); }
  }
  const sample = async (input, opts) => ({ text: await run(input, opts), truncated: false, modelTierApplied: "default" });
  sample.json = async (input, opts) => parseLoose(await run(input, opts));
  sample.limits = async () => ({ maxPromptBytes: 262144 });
  return sample;
}

/* ---------- saving a file: share sheet on phones, normal download elsewhere ---------- */
const downloads = {
  async save({ filename, data }) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/i.test(filename) ? "application/json" : "text/plain" });
    try {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && matchMedia("(pointer: coarse)").matches && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { status: "saved" };
      }
    } catch (e) { if (e && e.name === "AbortError") throw { code: "declined" }; }
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return { status: "saved" };
  },
};

function makeApi(app, fdb, user, appCheckReady) {
  const uid = user.uid;
  const me = { id: uid, name: user.displayName || "", email: user.email || null, avatarUrl: "", color: "#D7263D", isOwner: true, canEdit: true };
  const userApi = { id: async () => uid, me: async () => me, isOwner: async () => true, canEdit: async () => true, can: async () => true,
    name: async () => me.name, profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: i === uid ? me.name : "", isMe: i === uid, guest: false, avatarUrl: "", color: me.color, email: null }])) };
  return { db: makeDb(fdb), user: userApi, sample: makeSample(app, appCheckReady), downloads };
}

/* ---------- sign in ---------- */
const AUTH_ERR = {
  "auth/invalid-email": "Tohle není platný e-mail.",
  "auth/missing-password": "Zadej heslo.",
  "auth/invalid-credential": "Špatný e-mail nebo heslo.",
  "auth/wrong-password": "Špatný e-mail nebo heslo.",
  "auth/user-not-found": "Účet s tímto e-mailem neexistuje. Vytvoř si ho.",
  "auth/email-already-in-use": "Účet s tímto e-mailem už existuje. Přihlas se.",
  "auth/weak-password": "Heslo musí mít aspoň 6 znaků.",
  "auth/too-many-requests": "Moc pokusů najednou. Zkus to za chvíli.",
  "auth/network-request-failed": "Nejsi připojený k internetu.",
  "auth/operation-not-allowed": "Tenhle způsob přihlášení není ve Firebase zapnutý.",
  "auth/unauthorized-domain": "Tahle adresa není ve Firebase povolená (Authentication → Settings → Authorized domains).",
  "auth/popup-blocked": "Prohlížeč zablokoval přihlašovací okno. Povol vyskakovací okna, nebo se přihlas e-mailem.",
};
function showLogin(auth) {
  let mode = "in";
  authEl.hidden = false;
  const draw = () => {
    const em = (authEl.querySelector("#auEmail") || {}).value || "";
    authEl.innerHTML = `<div class="auth-in"><div class="card blanket auth-card">
      <h1 class="auth-h"><span class="hl">Makro deník</span></h1>
      <p class="fhint">${mode === "in" ? "Přihlas se a tvoje data budou na všech zařízeních." : "Vytvoř si účet. Stačí e-mail a heslo."}</p>
      <form id="auForm" class="stack" novalidate>
        <div class="field"><label for="auEmail">E-mail</label><input class="inp" id="auEmail" type="email" autocomplete="email" inputmode="email" value="${h(em)}"></div>
        <div class="field"><label for="auPass">Heslo${mode === "up" ? ' <span class="hint">aspoň 6 znaků</span>' : ""}</label>
          <input class="inp" id="auPass" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}"></div>
        <div class="errmsg" id="auErr" role="alert"></div>
        <button class="btn btn-primary btn-big" type="submit" id="auGo">${mode === "in" ? "Přihlásit se" : "Vytvořit účet"}</button>
      </form>
      <button class="btn btn-ghost" type="button" id="auToggle">${mode === "in" ? "Nemáš účet? Vytvoř si ho" : "Už máš účet? Přihlas se"}</button>
      ${mode === "in" ? `<button class="btn btn-ghost" type="button" id="auReset" style="min-height:44px">Zapomenuté heslo</button>` : ""}
      <div class="auth-or"><span>nebo</span></div>
      <button class="btn btn-soft" type="button" id="auGoogle"><span aria-hidden="true" style="font-weight:900;color:#4285F4">G</span> Pokračovat přes Google</button>
    </div></div>`;
  };
  draw();
  const err = (msg, ok) => { const el = authEl.querySelector("#auErr"); if (el) { el.textContent = msg; el.style.color = ok ? "var(--good)" : ""; } };
  const fail = e => err(AUTH_ERR[e && e.code] || "Přihlášení se nepovedlo. Zkus to znovu.");
  authEl.onclick = async e => {
    const id = e.target.closest("button") && e.target.closest("button").id;
    if (id === "auToggle") { mode = mode === "in" ? "up" : "in"; draw(); }
    else if (id === "auReset") {
      const em = authEl.querySelector("#auEmail").value.trim();
      if (!em) { err("Napiš svůj e-mail a klepni znovu na Zapomenuté heslo."); return; }
      try { await sendPasswordResetEmail(auth, em); err("Poslal jsem ti e-mail s odkazem na nové heslo.", true); } catch (x) { fail(x); }
    }
    else if (id === "auGoogle") {
      try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (x) { if (x && x.code !== "auth/popup-closed-by-user" && x.code !== "auth/cancelled-popup-request") fail(x); }
    }
  };
  authEl.onsubmit = async e => {
    e.preventDefault();
    const em = authEl.querySelector("#auEmail").value.trim(), pw = authEl.querySelector("#auPass").value, go = authEl.querySelector("#auGo");
    if (!em || !pw) { err("Vyplň e-mail i heslo."); return; }
    go.disabled = true; err("");
    try { mode === "in" ? await signInWithEmailAndPassword(auth, em, pw) : await createUserWithEmailAndPassword(auth, em, pw); }
    catch (x) { fail(x); go.disabled = false; }
  };
}
</script>
